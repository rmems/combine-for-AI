name: Mini Eval Smoke

on:
  # Also run on main so a merge is verified by the same checks that gated it.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests group by ref, so pushing again cancels the superseded run.
  #
  # Pushes to main group by commit SHA instead, giving every merge its own
  # group. A shared group would not be safe here even with cancel-in-progress
  # off: GitHub allows at most one running and one pending job per group, so
  # when three merges land in quick succession the middle one's pending job is
  # replaced by the newest and that commit is never verified.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: uv sync
        run: uv sync --frozen

      - name: Run smoke tests
        run: uv run pytest tests/test_smoke.py -q

      - name: Run smoke benchmark script
        run: uv run python scripts/run_smoke_benchmark.py --output-dir reports/smoke --formats json,csv

      - name: Verify outputs exist
        run: |
          test -d reports/smoke/json
          test -d reports/smoke/csv
          test "$(ls -A reports/smoke/json/*.json)"
          test "$(ls -A reports/smoke/csv/*.csv)"
          echo "PASS: JSON and CSV outputs generated"
