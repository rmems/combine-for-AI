# Codacy quality gate on this org is issueThreshold=0.
# Test asserts trip Bandit B101 ("use of assert") as High Security — exclude tests.
# See agoge-forger for the same pattern.
---
exclude_paths:
  - "tests/**"
  - "tests/**/*"
  - "**/tests/**"
  - "**/__pycache__/**"
  - ".venv/**"
  - "reports/**"
  - "CLAUDE.md"
engines:
  complexity:
    exclude_paths:
      - "tests/**"
      - "tests/**/*"
  duplication:
    exclude_paths:
      - "tests/**"
      - "tests/**/*"
  bandit:
    # Git blob object ids are SHA-1 by specification (live_gold.git_blob_sha1).
    # Bandit B324 has no FIPS/usedforsecurity exception; inline # nosec is ignored here.
    exclude_paths:
      - "src/combine_for_ai/live_gold.py"
