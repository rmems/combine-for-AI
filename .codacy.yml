# Codacy quality gate on this org is issueThreshold=0.
# Test asserts trip Bandit B101 ("use of assert") as High Security — exclude tests.
# See agoge-forger for the same pattern.
---
exclude_paths:
  - "tests/**"
  - "tests/**/*"
  - "**/tests/**"
  - "**/__pycache__/**"
  - ".venv/**"
  - "reports/**"
  # Git blob ids are SHA-1 by spec; Bandit B324 has no usedforsecurity exception.
  - "src/combine_for_ai/git_blob.py"
  - "CLAUDE.md"
engines:
  complexity:
    exclude_paths:
      - "tests/**"
      - "tests/**/*"
  duplication:
    exclude_paths:
      - "tests/**"
      - "tests/**/*"
